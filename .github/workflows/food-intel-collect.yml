name: Food Intel Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches: [main]
    paths:
      - "food-intel/src/**"
      - "food-intel/config/**"
      - "food-intel/tests/**"
      - "food-intel/requirements.txt"
      - ".github/workflows/food-intel-collect.yml"

permissions:
  contents: write

concurrency:
  group: food-intel-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: food-intel/requirements.txt

      - name: Install dependencies
        run: pip install -r food-intel/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s food-intel/tests -p "test_*.py"

      - name: Collect, classify and score news
        run: python food-intel/src/collect.py

      - name: Commit dataset changes
        shell: bash
        run: |
          if git diff --quiet -- food-intel/data/news.json; then
            echo "No dataset changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add food-intel/data/news.json
          git commit -m "data(food-intel): refresh scored news feed"
          git push
