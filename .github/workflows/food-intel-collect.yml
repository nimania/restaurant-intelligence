name: Food Intel Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches: [main]
    paths:
      - "food-intel/src/**"
      - "food-intel/config/**"
      - "food-intel/tests/**"
      - "food-intel/requirements.txt"
      - ".github/workflows/food-intel-collect.yml"

permissions:
  contents: write

concurrency:
  group: food-intel-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FOOD_INTEL_TRANSLATION_LIMIT: "300"
      FOOD_INTEL_BODY_READER_LIMIT: "32"
      FOOD_INTEL_QUALITY_RETRY_LIMIT: "80"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r food-intel/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s food-intel/tests -p "test_*.py"

      - name: Collect, classify, translate, score and build signals
        run: python food-intel/src/collect.py

      - name: Discover Iranian brand mentions via Google News
        run: python food-intel/src/brand_watch.py

      - name: Discover Iranian brand mentions via Bing News
        run: python food-intel/src/brand_watch_bing.py

      - name: Monitor official Iranian brand channels
        run: python food-intel/src/official_brand_watch.py

      - name: Discover global brand mentions
        run: python food-intel/src/brand_watch_global.py

      - name: Discover Turkish brands and food-industry news
        run: python food-intel/src/turkey_watch.py

      - name: Read article bodies and deepen Persian reports
        run: python food-intel/src/body_enrich.py

      - name: Quality-check and repair Persian translations
        run: python food-intel/src/quality_enrich.py

      - name: Audit recent Persian v2 samples
        run: python food-intel/src/translation_audit.py

      - name: Commit dataset changes
        shell: bash
        run: |
          if git diff --quiet -- food-intel/data/news.json food-intel/data/signals.json; then
            echo "No dataset changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add food-intel/data/news.json food-intel/data/signals.json
          git commit -m "data(food-intel): refresh Persian news, deep reports and quality"

          # UI/docs may have landed on main while this long collector was running.
          # Rebase the data commit onto the newest main before pushing so the
          # quality-gated dataset is not lost to a non-fast-forward rejection.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
