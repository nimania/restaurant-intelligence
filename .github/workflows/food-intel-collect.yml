name: Food Intel Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches: [main]
    paths:
      - "food-intel/src/**"
      - "food-intel/config/**"
      - "food-intel/tests/**"
      - "food-intel/requirements.txt"
      - ".github/workflows/food-intel-collect.yml"

permissions:
  contents: write

concurrency:
  group: food-intel-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FOOD_INTEL_TRANSLATION_LIMIT: "180"
      FOOD_INTEL_BODY_READER_LIMIT: "18"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r food-intel/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s food-intel/tests -p "test_*.py"

      - name: Collect, classify, translate, score and build signals
        run: python food-intel/src/collect.py

      - name: Read article bodies and deepen Persian reports
        run: python food-intel/src/body_enrich.py

      - name: Commit dataset changes
        shell: bash
        run: |
          if git diff --quiet -- food-intel/data/news.json food-intel/data/signals.json; then
            echo "No dataset changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add food-intel/data/news.json food-intel/data/signals.json
          git commit -m "data(food-intel): refresh Persian news and deep reports"
          git push
