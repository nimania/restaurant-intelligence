name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "properties.html"
      - "data/**"
      - "food-intel/*.html"
      - "food-intel/*.css"
      - "food-intel/*.js"
      - "food-intel/data/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site/food-intel
          cp index.html styles.css app.js properties.html _site/
          cp -r data _site/data
          cp food-intel/*.html _site/food-intel/
          cp food-intel/*.css _site/food-intel/
          cp food-intel/*.js _site/food-intel/
          cp -r food-intel/data _site/food-intel/data
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
