brands:
  # Restaurant/QSR watchlist. These IDs refer to brands_iran.yml.
  # `terms` are deliberately specific to reduce false positives in Persian search.
  - id: sheila
    terms: ["رستوران شیلا", "فست فود شیلا", "پیتزا شیلا"]
    context: ["رستوران", "پیتزا", "فست فود", "شعبه", "منو"]
  - id: kabooky
    terms: ["رستوران کابوکی", "کابوکی تجریش", "مرغ سوخاری کابوکی"]
    context: ["رستوران", "مرغ سوخاری", "فست فود", "شعبه"]
  - id: padideh_shandiz
    terms: ["رستوران پدیده شاندیز", "گروه رستوران های پدیده شاندیز", "پدیده شاندیز رستوران"]
    context: ["رستوران", "شعبه", "منو", "فود هال", "کافه"]
  - id: atawich
    terms: ["عطاویچ", "رستوران عطاویچ"]
    context: ["رستوران", "فست فود", "شعبه", "منو", "فرنچایز"]
  - id: haida
    terms: ["فست فود هایدا", "ساندویچ هایدا", "رستوران هایدا"]
    context: ["رستوران", "ساندویچ", "شعبه", "منو"]
  - id: akbar_joojeh
    terms: ["اکبرجوجه", "اکبر جوجه"]
    context: ["رستوران", "شعبه", "منو", "فرنچایز"]

  # Food/FMCG brands. Broader watch because meaningful updates often appear in business news.
  - id: kalleh
    terms: ["کاله", "صنایع غذایی کاله"]
    context: ["محصول", "برند", "کارخانه", "صادرات", "فروش", "بازار"]
  - id: mihan_dairy
    terms: ["لبنیات میهن", "بستنی میهن", "صنایع غذایی میهن"]
    context: ["محصول", "برند", "کارخانه", "صادرات", "فروش", "بازار"]
  - id: pegah
    terms: ["لبنیات پگاه", "صنایع شیر ایران پگاه"]
    context: ["محصول", "برند", "کارخانه", "صادرات", "فروش", "بازار"]
  - id: ramak
    terms: ["لبنیات رامک", "رامک لبنیات"]
    context: ["محصول", "برند", "کارخانه", "صادرات", "فروش", "بازار"]
  - id: zarr_group
    terms: ["زر ماکارون", "گروه صنعتی زر", "زرکام"]
    context: ["محصول", "برند", "کارخانه", "صادرات", "فروش", "بازار"]
  - id: tak_macaron
    terms: ["تک ماکارون"]
    context: ["محصول", "برند", "کارخانه", "صادرات", "فروش", "بازار"]
  - id: minoo_group
    terms: ["گروه صنعتی مینو", "شرکت مینو", "صنایع غذایی مینو"]
    context: ["محصول", "برند", "کارخانه", "صادرات", "فروش", "بازار"]
  - id: shirin_asal
    terms: ["شیرین عسل", "گروه شیرین عسل"]
    context: ["محصول", "برند", "کارخانه", "صادرات", "فروش", "بازار"]
  - id: shoniz
    terms: ["شونیز", "صنایع غذایی شونیز"]
    context: ["محصول", "برند", "کارخانه", "صادرات", "فروش", "بازار"]
  - id: farmand
    terms: ["شکلات فرمند", "فرمند شکلات"]
    context: ["محصول", "برند", "کارخانه", "صادرات", "فروش", "بازار"]
  - id: mahram
    terms: ["صنایع غذایی مهرام", "محصولات مهرام"]
    context: ["محصول", "برند", "کارخانه", "صادرات", "فروش", "بازار"]
  - id: sunich
    terms: ["سن ایچ", "سن‌ایچ"]
    context: ["نوشیدنی", "محصول", "برند", "کارخانه", "صادرات", "فروش"]
  - id: alis
    terms: ["عالیس نوشیدنی", "شرکت عالیس"]
    context: ["نوشیدنی", "محصول", "برند", "کارخانه", "صادرات", "فروش"]
  - id: behnoush
    terms: ["بهنوش ایران", "شرکت بهنوش"]
    context: ["نوشیدنی", "محصول", "برند", "کارخانه", "صادرات", "فروش"]
  - id: zamzam
    terms: ["زمزم ایران", "نوشابه زمزم"]
    context: ["نوشیدنی", "محصول", "برند", "کارخانه", "صادرات", "فروش"]
  - id: cheetoz
    terms: ["چی توز", "چی‌توز"]
    context: ["محصول", "برند", "اسنک", "فروش", "بازار", "کمپین"]
  - id: mazmaz
    terms: ["مزمز", "گروه مزمز"]
    context: ["محصول", "برند", "اسنک", "فروش", "بازار", "کمپین"]
  - id: snappfood
    terms: ["اسنپ فود", "اسنپ‌فود"]
    context: ["رستوران", "سفارش غذا", "دلیوری", "فودتک", "بازار", "کمپین"]

settings:
  batch_size: 6
  lookback_days: 30
  priority: 2
