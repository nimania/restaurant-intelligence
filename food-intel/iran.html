<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>رادار بازار ایران | صنعت غذا</title>
<style>
:root{--bg:#080a0d;--panel:#101b16;--line:#294638;--text:#f4f7f5;--muted:#91a39a;--green:#75d39b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}a{color:inherit}.wrap{max-width:760px;margin:auto;padding:22px 14px 60px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.head h1{margin:0;font-size:28px}.back{text-decoration:none;border:1px solid var(--line);padding:8px 11px;border-radius:999px;font-size:12px}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:14px 0}input,select{width:100%;background:#0c1410;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;font:inherit;font-size:12px}.post{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:10px}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px}.post h2{font-size:19px;line-height:1.65;margin:10px 0 7px}.post h2 a{text-decoration:none}.post p{color:#bdcbc4;font-size:14px;line-height:1.9;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid #385446;border-radius:999px;padding:4px 7px;font-size:10px}.foot{display:flex;justify-content:space-between;margin-top:12px;font-size:12px}.foot a{text-decoration:none}.score{color:var(--green);font-weight:800}.empty{text-align:center;color:var(--muted);padding:60px;border:1px dashed var(--line);border-radius:14px}@media(max-width:650px){.toolbar{grid-template-columns:1fr}.head h1{font-size:22px}}
</style></head>
<body><main class="wrap"><div class="head"><div><small style="color:var(--green)">🇮🇷 Food Intel</small><h1>رادار بازار ایران</h1></div><a class="back" href="./">← همه بازارها</a></div><div class="toolbar"><input id="q" placeholder="جست‌وجو در خبر یا برند…"><select id="cat"><option value="">همه موضوع‌ها</option></select><select id="sort"><option value="new">جدیدترین</option><option value="iran">مرتبط‌ترین با ایران</option><option value="score">مهم‌ترین</option></select></div><div id="feed"><div class="empty">در حال بارگذاری…</div></div></main>
<script>
const $=x=>document.getElementById(x),nf=new Intl.NumberFormat('fa-IR');let items=[];const labels={restaurant_operations:'عملیات رستوران',restaurant_technology_ai:'فناوری و هوش مصنوعی',equipment_automation:'تجهیزات و اتوماسیون',food_cost_pricing:'هزینه و قیمت‌گذاری',supply_chain:'زنجیره تأمین',food_safety:'ایمنی غذا',marketing_branding:'بازاریابی و برندینگ',restaurant_design_decor:'طراحی و دکور',packaging_design:'بسته‌بندی',food_manufacturing:'تولید صنایع غذایی',ingredients_rd:'مواد اولیه',restaurant_industry:'صنعت رستوران',food_industry:'صنعت غذا',consumer_behavior:'رفتار مصرف‌کننده',menu_product_innovation:'نوآوری منو و محصول'};function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function faN(v){return nf.format(v??0)}function ago(d){const h=Math.max(0,(Date.now()-new Date(d))/36e5);return h<24?`${faN(Math.round(h))} ساعت قبل`:`${faN(Math.round(h/24))} روز قبل`}function render(){const q=$('q').value.trim().toLowerCase(),cat=$('cat').value,sort=$('sort').value;let r=items.filter(x=>{const hay=[x.title_fa,x.summary_fa,x.source?.name,...(x.brands||[]).flatMap(b=>[b.fa,b.name]),...(x.categories||[])].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!cat||(x.categories||[]).includes(cat))});r.sort(sort==='iran'?(a,b)=>(b.iran_relevance_score||0)-(a.iran_relevance_score||0):sort==='score'?(a,b)=>(b.relevance_score||0)-(a.relevance_score||0):(a,b)=>new Date(b.published_at)-new Date(a.published_at));$('feed').innerHTML=r.length?r.map(x=>`<article class="post"><div class="meta"><span>${esc(x.source?.name||'منبع')} · 🇮🇷 ایران · ${ago(x.published_at)}</span><span class="score">${faN(x.iran_relevance_score||0)}/۱۰۰ ایران</span></div><h2><a href="story.html?id=${encodeURIComponent(x.id)}">${esc(x.title_fa)}</a></h2>${x.summary_fa?`<p>${esc(x.summary_fa)}</p>`:''}<div class="chips">${(x.brands||[]).slice(0,4).map(b=>`<span class="chip">${esc(b.fa||b.name)}</span>`).join('')}${(x.categories||[]).slice(0,3).map(c=>`<span class="chip">${esc(labels[c]||c)}</span>`).join('')}</div><div class="foot"><a href="story.html?id=${encodeURIComponent(x.id)}">جزئیات خبر</a><a href="${esc(x.url)}" target="_blank" rel="noopener">اصل خبر ↗</a></div></article>`).join(''):'<div class="empty">خبری پیدا نشد.</div>'}async function boot(){const r=await fetch('data/news.json?ts='+Date.now()),d=await r.json();items=(d.items||[]).filter(x=>x.title_fa&&(x.market==='iran'||(x.iran_relevance_score||0)>=70));[...new Set(items.flatMap(x=>x.categories||[]))].sort().forEach(c=>$('cat').insertAdjacentHTML('beforeend',`<option value="${esc(c)}">${esc(labels[c]||c)}</option>`));render()}['q','cat','sort'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));boot().catch(()=>$('feed').innerHTML='<div class="empty">خطا در بارگذاری داده.</div>');
</script></body></html>
