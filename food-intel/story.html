<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>خبر | رادار صنعت غذا</title>
<meta name="description" content="صفحه اختصاصی خبر در رادار صنعت غذا" />
<style>
:root{--bg:#080a0d;--panel:#0f1318;--panel2:#141a20;--line:#252c34;--text:#f5f7f9;--muted:#929ca7;--accent:#ffb347;--green:#75d39b;--blue:#8ab4f8;--iran:#101b16;--iranLine:#294638}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}a{color:inherit}.topbar{border-bottom:1px solid var(--line);background:rgba(8,10,13,.94);position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}.topinner{max-width:1180px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}.back{text-decoration:none;font-size:13px;border:1px solid var(--line);padding:8px 11px;border-radius:999px}.wrap{max-width:1180px;margin:auto;padding:24px 16px 60px}.layout{direction:ltr;display:grid;grid-template-columns:minmax(0,780px) 320px;gap:22px;align-items:start}.article,.rail{direction:rtl}.article{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:26px}.article.iran{background:var(--iran);border-color:var(--iranLine)}.eyebrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12px}.country{border:1px solid var(--line);border-radius:999px;padding:4px 8px}.article.iran .country{border-color:#37604b;color:#9de0b8}.article h1{font-size:clamp(28px,4vw,46px);line-height:1.45;margin:16px 0 12px}.lead{font-size:17px;line-height:2;color:#d1d7dd;margin:0 0 18px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.chip{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:5px 8px;background:#121820;color:#c7cfd6}.brand-chip{font-weight:800}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}.metric{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:12px;padding:11px}.metric b{display:block;font-size:18px}.metric span{font-size:10px;color:var(--muted)}.section{border-top:1px solid var(--line);padding-top:20px;margin-top:22px}.section h2{font-size:19px;margin:0 0 12px}.section p{font-size:15px;line-height:2.05;color:#c4ccd3;margin:0 0 13px}.section ul{margin:0;padding-right:20px}.section li{margin:8px 0;line-height:1.9;color:#c4ccd3}.source-box{background:#0b0f13;border:1px solid var(--line);border-radius:14px;padding:14px}.source-box .original{font-size:13px;line-height:1.8;color:#aeb7c0;margin:8px 0 0;direction:ltr;text-align:left}.source-btn{display:inline-block;margin-top:13px;text-decoration:none;background:var(--text);color:#111;padding:10px 14px;border-radius:10px;font-size:12px;font-weight:800}.rail{position:sticky;top:75px}.rail-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}.rail-card h3{font-size:14px;margin:0 0 10px}.related a{display:block;text-decoration:none;border-bottom:1px solid var(--line);padding:11px 0}.related a:last-child{border-bottom:0}.related b{display:block;font-size:13px;line-height:1.65}.related span{display:block;font-size:10px;color:var(--muted);margin-top:4px}.fact{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:8px 0;font-size:12px}.fact:last-child{border:0}.fact span{color:var(--muted)}.notice{font-size:11px;line-height:1.9;color:#7f8993;margin-top:14px}.loading{padding:70px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
@media(max-width:900px){.layout{display:block}.rail{position:static;margin-top:14px}.article{padding:20px}.metrics{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.wrap{padding:12px 10px 40px}.article{border-radius:14px;padding:16px}.article h1{font-size:26px}.lead{font-size:15px}.metrics{grid-template-columns:1fr 1fr}.topinner{padding:10px}.article .section p{font-size:14px}}
</style>
</head>
<body>
<header class="topbar"><div class="topinner"><a class="back" href="./">← بازگشت به فید</a><strong>رادار صنعت غذا</strong></div></header>
<main class="wrap"><div id="app" class="loading">در حال دریافت خبر…</div></main>
<script>
const nf=new Intl.NumberFormat('fa-IR');const labels={qsr_fast_food:'فست‌فود و سرویس سریع',fast_casual:'فست‌کژوال',restaurant_operations:'عملیات رستوران',menu_product_innovation:'نوآوری منو و محصول',restaurant_technology_ai:'فناوری رستوران و هوش مصنوعی',equipment_automation:'تجهیزات و اتوماسیون',food_cost_pricing:'هزینه غذا و قیمت‌گذاری',supply_chain:'زنجیره تأمین',food_safety:'ایمنی غذا',labor_management:'نیروی انسانی و مدیریت',franchising:'فرنچایز',delivery_drive_thru:'دلیوری و درایو‌ثرو',consumer_behavior:'رفتار مصرف‌کننده',marketing_branding:'بازاریابی و برندینگ',restaurant_design_decor:'طراحی و دکور رستوران',packaging_design:'بسته‌بندی',beverage:'نوشیدنی',food_manufacturing:'تولید صنایع غذایی',ingredients_rd:'مواد اولیه و تحقیق‌وتوسعه',retail_food:'خرده‌فروشی غذا',regulation:'قانون‌گذاری و مقررات',sustainability:'پایداری',restaurant_industry:'صنعت رستوران',food_industry:'صنعت غذا'};
const sourceFa={restaurant_dive:'رستوران دایو',food_dive:'فود دایو',fast_casual:'فست‌کژوال',qsr_web:'کیو‌اس‌آر وب',restaurant_business:'رستوران بیزنس',modern_restaurant_management:'مدیریت مدرن رستوران',restaurant_news:'رستوران نیوز',pizza_marketplace:'پیتزا مارکت‌پلیس',the_spoon:'د اسپون',restaurant_technology_news:'اخبار فناوری رستوران',food_safety_news:'اخبار ایمنی غذا',fda_food_safety_recalls:'فراخوان‌های غذایی FDA',fda_outbreaks:'گزارش شیوع‌های غذایی FDA',food_engineering:'مهندسی غذا',food_business_news_manufacturers:'فود بیزنس نیوز',refrigerated_frozen_foods:'غذاهای سرد و منجمد',foodservice_equipment_reports:'گزارش تجهیزات فودسرویس',foodservice_equipment_journal:'ژورنال تجهیزات فودسرویس',iranpack:'ایران‌پک',ifoods_mag:'مجله آی‌فودز',digiato_tech_iran_food:'دیجیاتو',isna_iran_food:'ایسنا',mehr_iran_food:'مهر',tasnim_economy_iran_food:'تسنیم',yjc_iran_food:'باشگاه خبرنگاران',tabnak_iran_food:'تابناک'};
const countries={IR:['🇮🇷','ایران'],US:['🇺🇸','آمریکا'],GB:['🇬🇧','بریتانیا'],UK:['🇬🇧','بریتانیا'],CA:['🇨🇦','کانادا'],DE:['🇩🇪','آلمان'],FR:['🇫🇷','فرانسه'],IT:['🇮🇹','ایتالیا'],ES:['🇪🇸','اسپانیا'],AU:['🇦🇺','استرالیا'],JP:['🇯🇵','ژاپن'],CN:['🇨🇳','چین'],AE:['🇦🇪','امارات'],TR:['🇹🇷','ترکیه'],EU:['🇪🇺','اتحادیه اروپا'],global:['🌍','جهانی']};
const brandStyles={mcdonalds:['#FFC72C','#111','#DA291C'],starbucks:['#00754A','#fff','#00754A'],coca_cola:['#F40009','#fff','#F40009'],pepsico:['#004B93','#fff','#004B93'],kfc:['#E4002B','#fff','#E4002B'],taco_bell:['#702082','#fff','#702082'],pizza_hut:['#EE3124','#fff','#EE3124'],burger_king:['#D62300','#fff','#D62300'],wendys:['#E2203D','#fff','#E2203D'],chipotle:['#451400','#fff','#451400'],sweetgreen:['#004F35','#fff','#004F35'],cava:['#F4CB4C','#111','#F4CB4C'],doordash:['#FF3008','#fff','#FF3008'],uber_eats:['#06C167','#111','#06C167'],dominos:['#006491','#fff','#006491'],snappfood:['#ff00a6','#fff','#ff00a6']};
const insights={restaurant_technology_ai:'اهمیت این دسته بیشتر در اثر فناوری بر سفارش‌گیری، سرعت سرویس، هزینه نیروی انسانی، داده مشتری و کنترل عملیات رستوران است.',equipment_automation:'در خبرهای تجهیزات و اتوماسیون، نکته کلیدی معمولاً اثر فناوری بر ظرفیت تولید، یکنواختی کیفیت، مصرف انرژی، تعمیرات و بهره‌وری آشپزخانه است.',food_cost_pricing:'این موضوع مستقیماً به حاشیه سود، مهندسی منو، قیمت‌گذاری و رفتار خرید مشتری مربوط می‌شود.',supply_chain:'اخبار زنجیره تأمین می‌تواند روی موجودی، قیمت مواد اولیه، دسترسی به محصول و برنامه‌ریزی خرید اپراتورها اثر بگذارد.',food_safety:'اهمیت خبرهای ایمنی غذا در ریسک سلامت، فراخوان محصول، الزامات قانونی و اعتماد مشتری است.',consumer_behavior:'این خبر از زاویه تغییر رفتار مشتری مهم است؛ تغییری که می‌تواند روی منو، قیمت، کانال فروش و بازاریابی اثر بگذارد.',marketing_branding:'در این دسته، ارزش خبر بیشتر به جایگاه‌سازی برند، طراحی تجربه مشتری، تبلیغات و تمایز رقابتی مربوط است.',restaurant_design_decor:'طراحی و دکور فقط مسئله زیبایی نیست؛ می‌تواند روی جریان حرکت، ظرفیت، تجربه مشتری و کارایی عملیات اثر بگذارد.',packaging_design:'بسته‌بندی در این صنعت هم‌زمان با هزینه، ایمنی، لجستیک، تجربه برند و ماندگاری محصول ارتباط دارد.',food_manufacturing:'برای تولیدکنندگان، این دسته معمولاً با ظرفیت تولید، فرآیند، کیفیت، هزینه و فناوری کارخانه پیوند دارد.',menu_product_innovation:'نوآوری منو و محصول می‌تواند هم ابزار جذب مشتری باشد و هم روی پیچیدگی عملیات، هزینه مواد و سرعت سرویس اثر بگذارد.',delivery_drive_thru:'دلیوری و درایو‌ثرو مستقیماً به سرعت سرویس، تجربه دیجیتال، هزینه کانال و طراحی عملیات مرتبط است.',restaurant_operations:'این خبر در حوزه عملیات قرار می‌گیرد؛ یعنی موضوعاتی مثل جریان کار، سرعت سرویس، نیروی انسانی، کنترل هزینه و ثبات کیفیت.'};
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function faN(v){return v===null||v===undefined?'—':nf.format(v)}function srcName(x){return sourceFa[x.source?.id]||x.source?.name||'منبع نامشخص'}function countryInfo(x){let c=(x.country||x.source?.country||'').toUpperCase();if(!c&&x.market==='iran')c='IR';if(!c&&x.region==='global')return countries.global;return countries[c]||[c?'🏳️':'🌍',c||'جهانی']}function brandChip(b){const s=brandStyles[b.id];if(!s)return `<span class="chip brand-chip">${esc(b.fa||b.name)}</span>`;return `<span class="chip brand-chip" style="background:${s[0]};color:${s[1]};border-color:${s[2]}">${esc(b.fa||b.name)}</span>`}function detailUrl(x){return `story.html?id=${encodeURIComponent(x.id)}`}
function relatedScore(a,b){let s=0;const ab=new Set((a.brands||[]).map(x=>x.id)),bb=new Set((b.brands||[]).map(x=>x.id));bb.forEach(x=>{if(ab.has(x))s+=7});const ac=new Set(a.categories||[]);(b.categories||[]).forEach(x=>{if(ac.has(x))s+=3});const at=new Set(a.topics||[]);(b.topics||[]).forEach(x=>{if(at.has(x))s+=2});const ca=(a.country||a.source?.country||''),cb=(b.country||b.source?.country||'');if(ca&&ca===cb)s+=1;return s}
function narrative(x){const pars=[];if(x.summary_fa)pars.push(x.summary_fa);const cats=(x.categories||[]).map(c=>labels[c]||c);const brands=(x.brands||[]).map(b=>b.fa||b.name);if(brands.length)pars.push(`این خبر به ${brands.join('، ')} مربوط است و در رادار ما ذیل ${cats.slice(0,3).join('، ')||'موضوعات تخصصی صنعت غذا'} طبقه‌بندی شده است.`);else if(cats.length)pars.push(`این خبر در رادار ما ذیل ${cats.slice(0,3).join('، ')} طبقه‌بندی شده است.`);const insight=(x.categories||[]).map(c=>insights[c]).find(Boolean);if(insight)pars.push(insight);if((x.iran_relevance_score||0)>=70)pars.push(`امتیاز ارتباط این خبر با بازار ایران ${faN(x.iran_relevance_score)} از ۱۰۰ است؛ بنابراین در رصد بازار ایران نیز در اولویت قرار می‌گیرد.`);return pars}
function render(x,all){const ci=countryInfo(x),isIran=x.market==='iran'||ci[1]==='ایران';document.title=`${x.title_fa} | رادار صنعت غذا`;const related=all.filter(y=>y.id!==x.id&&y.title_fa).map(y=>[relatedScore(x,y),y]).filter(z=>z[0]>0).sort((a,b)=>b[0]-a[0]||new Date(b[1].published_at)-new Date(a[1].published_at)).slice(0,8).map(z=>z[1]);const pars=narrative(x);const keyFacts=[];if((x.brands||[]).length)keyFacts.push(`برندها و شرکت‌های اصلی: ${(x.brands||[]).map(b=>b.fa||b.name).join('، ')}`);if((x.categories||[]).length)keyFacts.push(`حوزه‌های اصلی: ${(x.categories||[]).map(c=>labels[c]||c).join('، ')}`);if((x.topics||[]).length)keyFacts.push(`موضوع‌های تشخیص‌داده‌شده: ${(x.topics||[]).slice(0,8).join('، ')}`);document.getElementById('app').className='layout';document.getElementById('app').innerHTML=`<article class="article ${isIran?'iran':''}"><div class="eyebrow"><span>${esc(srcName(x))}</span><span>·</span><span class="country">${ci[0]} ${esc(ci[1])}</span><span>·</span><span>${new Date(x.published_at).toLocaleString('fa-IR')}</span></div><h1>${esc(x.title_fa)}</h1>${x.summary_fa?`<p class="lead">${esc(x.summary_fa)}</p>`:''}<div class="chips">${(x.brands||[]).map(brandChip).join('')}${(x.categories||[]).map(c=>`<span class="chip">${esc(labels[c]||c)}</span>`).join('')}</div><div class="metrics"><div class="metric"><b>${faN(x.relevance_score)}</b><span>اهمیت از ۱۰۰</span></div><div class="metric"><b>${faN(x.iran_relevance_score||0)}</b><span>ارتباط با ایران</span></div><div class="metric"><b>${faN((x.brands||[]).length)}</b><span>برند شناسایی‌شده</span></div><div class="metric"><b>${faN((x.categories||[]).length)}</b><span>دسته تخصصی</span></div></div><section class="section"><h2>گزارش فارسی خبر</h2>${pars.map(p=>`<p>${esc(p)}</p>`).join('')}<div class="notice">این بخش گزارش و زمینه‌سازی فارسی بر اساس داده و خلاصه‌ای است که منبع در فید منتشر کرده؛ ترجمه خط‌به‌خط متن کامل مقاله نیست.</div></section>${keyFacts.length?`<section class="section"><h2>نکات کلیدی</h2><ul>${keyFacts.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></section>`:''}<section class="section"><h2>منبع و متن اصلی</h2><div class="source-box"><strong>${esc(srcName(x))}</strong>${x.title?`<div class="original">${esc(x.title)}</div>`:''}<a class="source-btn" href="${esc(x.url)}" target="_blank" rel="noopener">خواندن اصل خبر در منبع ↗</a></div></section></article><aside class="rail"><div class="rail-card"><h3>مشخصات خبر</h3><div class="fact"><span>کشور</span><b>${ci[0]} ${esc(ci[1])}</b></div><div class="fact"><span>منبع</span><b>${esc(srcName(x))}</b></div><div class="fact"><span>نویسنده</span><b>${esc(x.author||'ذکر نشده')}</b></div><div class="fact"><span>امتیاز اهمیت</span><b>${faN(x.relevance_score)}/۱۰۰</b></div><div class="fact"><span>جمع‌آوری</span><b>${new Date(x.collected_at).toLocaleDateString('fa-IR')}</b></div></div><div class="rail-card"><h3>خبرهای مرتبط</h3><div class="related">${related.length?related.map(y=>{const yc=countryInfo(y);return `<a href="${detailUrl(y)}"><b>${esc(y.title_fa)}</b><span>${yc[0]} ${esc(yc[1])} · ${esc(srcName(y))}</span></a>`}).join(''):'<span class="notice">خبر مرتبط کافی پیدا نشد.</span>'}</div></div></aside>`}
async function boot(){try{const id=new URLSearchParams(location.search).get('id');if(!id)throw new Error('شناسه خبر وجود ندارد');const r=await fetch('data/news.json?ts='+Date.now());const d=await r.json();const all=d.items||[],x=all.find(i=>i.id===id);if(!x)throw new Error('خبر پیدا نشد');if(!x.title_fa){document.getElementById('app').innerHTML='ترجمه فارسی این خبر هنوز تکمیل نشده است.';return}render(x,all)}catch(e){document.getElementById('app').className='loading';document.getElementById('app').textContent=e.message||'خطا در بارگذاری خبر.'}}boot();
</script>
</body></html>
